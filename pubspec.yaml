name: galleryplus
description: "GalleryPlus — local photo & video gallery."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0

  # Local media access (albums, assets, thumbnails, trash on Android 11+)
  photo_manager: ^3.6.0

  # Pinch-to-zoom image viewer
  photo_view: ^0.15.0

  # Video playback (smooth, wide codec support)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.6

  # Local database (favorites + custom trash records, pure Dart, no build_runner)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  path_provider: ^2.1.4
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
