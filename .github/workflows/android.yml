name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for creating/replacing the GitHub Release below.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build split APKs (per ABI, smaller downloads)
        run: flutter build apk --release --split-per-abi

      - name: Upload build artifact (per-run, 14 day backup)
        uses: actions/upload-artifact@v4
        with:
          name: galleryplus-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      # Rolling "latest" release: delete the previous one first so old
      # APKs never pile up — every push replaces it with a fresh single
      # release, auto-deleting the old one.
      - name: Delete previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --yes --cleanup-tag || true

      - name: Create release and upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: |
            Automated build from commit ${{ github.sha }}.
            This release is auto-replaced on every push to `main` — old
            APKs are deleted, not kept around.
          prerelease: false
          files: build/app/outputs/flutter-apk/*.apk
